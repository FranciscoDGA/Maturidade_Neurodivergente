<!DOCTYPE html>
<html>
<head>
  <title>Generate Logo PNG</title>
  <style>
    body { font-family: Arial; padding: 40px; background: #111; color: white; }
    canvas { border: 1px solid #333; margin: 20px; }
    .preview { margin-top: 40px; }
    h1 { color: #4a6bff; }
  </style>
</head>
<body>
  <h1>Logo Generator</h1>
  <canvas id="logo" width="96" height="96"></canvas>
  <canvas id="logo-large" width="192" height="192"></canvas>
  <br>
  <button onclick="downloadLogo()" style="padding:10px 20px;background:#4a6bff;color:white;border:none;border-radius:8px;cursor:pointer;font-size:16px;">Download PNG (96x96)</button>
  <button onclick="downloadLogoLarge()" style="padding:10px 20px;background:#7c3aed;color:white;border:none;border-radius:8px;cursor:pointer;font-size:16px;margin-left:10px;">Download PNG (192x192)</button>

  <script>
    function drawLogo(canvas, size) {
      const ctx = canvas.getContext('2d');
      const r = size * 0.208;
      
      // Background rounded rect
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#4a6bff');
      grad.addColorStop(1, '#7c3aed');
      
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
      
      // Letter M
      ctx.fillStyle = 'white';
      ctx.font = `900 ${size * 0.5}px Arial, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('M', size/2, size * 0.52);
      
      // Text NEURO
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = `700 ${size * 0.104}px Arial, sans-serif`;
      ctx.fillText('NEURO', size/2, size * 0.82);
    }
    
    drawLogo(document.getElementById('logo'), 96);
    drawLogo(document.getElementById('logo-large'), 192);
    
    function downloadLogo() {
      const link = document.createElement('a');
      link.download = 'logo.png';
      link.href = document.getElementById('logo').toDataURL('image/png');
      link.click();
    }
    
    function downloadLogoLarge() {
      const link = document.createElement('a');
      link.download = 'logo-192.png';
      link.href = document.getElementById('logo-large').toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
